name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'index.js'
      - 'manifest.json'
      - '*.css'

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install PWABuilder CLI
        run: npm install -g @pwabuilder/cli
      
      - name: Build Android APK
        run: |
          mkdir -p build
          pwabuilder build https://green-snake345.github.io/Snake/ -p android -o build/
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Snake-Android-APK
          path: build/*.apk
