name: Nativefier Build - Debug Version

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Nativefier
        run: npm install -g nativefier@47.3.0
      
      - name: Build Windows App
        run: |
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          nativefier --version
          
          nativefier `
            --name "SnakeGame" `
            --icon "https://green-snake345.github.io/Snake/icon-192.png" `
            --single-instance `
            --electron-version 28.3.3 `
            https://green-snake345.github.io/Snake/
          
          echo "=== Files created ==="
          Get-ChildItem
      
      - name: Package Windows
        run: |
          $folder = Get-ChildItem -Directory -Filter "SnakeGame*" | Select-Object -First 1
          if ($folder) {
            Compress-Archive -Path $folder.FullName -DestinationPath "Snake-Windows.zip"
            echo "Success: $($folder.Name)"
          } else {
            echo "ERROR: Folder not found"
            exit 1
          }
      
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snake-Windows
          path: Snake-Windows.zip

  build-linux:
    runs-on: ubuntu-latest
    
    steps:
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Update system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgtk-3-dev \
            libnss3-dev \
            libxss1 \
            libasound2-dev \
            libatk-bridge2.0-0 \
            libx11-xcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            libpango-1.0-0 \
            libcairo2 \
            zip
      
      - name: Install Nativefier
        run: npm install -g nativefier@47.3.0
      
      - name: Build Linux App
        run: |
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          nativefier --version
          
          nativefier \
            --name "SnakeGame" \
            --icon "https://green-snake345.github.io/Snake/icon-192.png" \
            --single-instance \
            --electron-version 28.3.3 \
            https://green-snake345.github.io/Snake/
          
          echo "=== Files created ==="
          ls -la
      
      - name: Package Linux
        run: |
          folder=$(find . -maxdepth 1 -type d -name "SnakeGame*" | head -1)
          if [ -n "$folder" ]; then
            zip -r "Snake-Linux.zip" "$folder"
            echo "Success: $folder"
          else
            echo "ERROR: Folder not found"
            ls -la
            exit 1
          fi
      
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snake-Linux
          path: Snake-Linux.zip
