name: Electron Builder - Windows and Linux

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Windows
        run: npm run build:win

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.yml

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 libxss1 libnss3 libasound2 \
            libx11-xcb1 libxtst6 libappindicator1 \
            libgconf-2-4 libnotify4 rpm \
            flatpak flatpak-builder
          sudo snap install snapcraft --classic

      - name: Setup Flatpak environment
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.electronjs.Electron2.BaseApp//23.08
          sudo flatpak install -y flathub org.freedesktop.Platform//23.08

      - name: Install dependencies
        run: npm install

      - name: Build Linux
        run: npm run build:linux

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pacman
            dist/*.snap
            dist/*.flatpak
            dist/*.tar.gz
            dist/*.yml

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pacman
            dist/*.snap
            dist/*.flatpak
            dist/*.tar.gz
            dist/*.exe
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
