name: Electron Builder - Windows and Linux

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./electron-app
        run: npm install

      - name: Build Windows
        working-directory: ./electron-app
        run: npm run build:win

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: |
            electron-app/dist/*.exe
            electron-app/dist/*.zip
            electron-app/dist/*.yml

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 libxss1 libnss3 libasound2t64 \
            libx11-xcb1 libxtst6 libnotify4 \
            rpm
          sudo snap install snapcraft --classic

      - name: Install dependencies
        working-directory: ./electron-app
        run: npm install

      - name: Build Linux
        working-directory: ./electron-app
        run: npm run build:linux

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: |
            electron-app/dist/*.AppImage
            electron-app/dist/*.deb
            electron-app/dist/*.rpm
            electron-app/dist/*.pacman
            electron-app/dist/*.snap
            electron-app/dist/*.tar.gz
            electron-app/dist/*.yml

  release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: build-linux
          path: dist
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
