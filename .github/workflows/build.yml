name: Nativefier Build for All Platforms

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Nativefier
        run: npm install -g nativefier

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libnss3 libxss1 libasound2 libatk-bridge2.0-0 libx11-xcb1

      - name: Build App
        run: |
          nativefier --name "SnakeGame" \
                     --icon https://green-snake345.github.io/Snake/icon-192.png \
                     --single-instance \
                     --electron-version 28.0.0 \
                     https://green-snake345.github.io/Snake/
          
          echo "=== Список созданных файлов ==="
          ls -la

      - name: Find and Zip Output (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $folder = Get-ChildItem -Directory -Filter "SnakeGame*" | Select-Object -First 1
          if ($folder) {
            Compress-Archive -Path $folder.FullName -DestinationPath "Snake-Windows.zip"
            echo "Упаковано: $($folder.Name)"
          } else {
            echo "Папка не найдена!"
            exit 1
          }

      - name: Find and Zip Output (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          folder=$(ls -d SnakeGame* | head -1)
          if [ -n "$folder" ]; then
            zip -r "Snake-macOS.zip" "$folder"
            echo "Упаковано: $folder"
          else
            echo "Папка не найдена!"
            exit 1
          fi

      - name: Find and Zip Output (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          folder=$(ls -d SnakeGame* | head -1)
          if [ -n "$folder" ]; then
            zip -r "Snake-Linux.zip" "$folder"
            echo "Упаковано: $folder"
          else
            echo "Папка не найдена!"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snake-${{ matrix.os }}
          path: Snake-*.zip
