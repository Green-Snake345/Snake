name: Nativefier Build - Final Attempt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Setup Node.js 16
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install Nativefier (stable version)
        run: npm install -g nativefier@46.1.0

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libgtk-3-0 \
            libnss3 \
            libxss1 \
            libasound2 \
            libatk-bridge2.0-0 \
            libx11-xcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            libpango-1.0-0 \
            libcairo2

      - name: Build App with detailed logging
        run: |
          echo "Starting Nativefier build..."
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "Nativefier version: $(nativefier --version)"
          
          nativefier \
            --name "SnakeGame" \
            --icon "https://green-snake345.github.io/Snake/icon-192.png" \
            --single-instance \
            --electron-version 25.9.8 \
            --verbose \
            https://green-snake345.github.io/Snake/
          
          echo "=== Build complete. Listing files ==="
          ls -la || dir

      - name: Find and package output (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          echo "Searching for SnakeGame folder..."
          Get-ChildItem -Directory | Where-Object { $_.Name -like "SnakeGame*" } | ForEach-Object {
            echo "Found: $($_.FullName)"
            Compress-Archive -Path $_.FullName -DestinationPath "Snake-Windows.zip" -Force
            echo "Packaged successfully"
          }
          if (-not (Test-Path "Snake-Windows.zip")) {
            echo "ERROR: No output folder found!"
            Get-ChildItem
            exit 1
          }

      - name: Find and package output (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "Searching for SnakeGame folder..."
          for dir in SnakeGame*; do
            if [ -d "$dir" ]; then
              echo "Found: $dir"
              zip -r "Snake-Linux.zip" "$dir"
              echo "Packaged successfully"
              break
            fi
          done
          if [ ! -f "Snake-Linux.zip" ]; then
            echo "ERROR: No output folder found!"
            ls -la
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snake-${{ matrix.os }}
          path: |
            Snake-Windows.zip
            Snake-Linux.zip
          if-no-files-found: error
