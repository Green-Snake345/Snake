name: Nativefier Build for All Platforms

on:
  workflow_dispatch: # Ручной запуск по кнопке

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Nativefier
        run: npm install -g nativefier

      - name: Build App
        run: |
          nativefier --name "SnakeGame" \
                     --icon https://green-snake345.github.io/Snake/icon-192.png \
                     --single-instance \
                     https://green-snake345.github.io/Snake/

      - name: Zip Output (Windows)
        if: matrix.os == 'windows-latest'
        run: Compress-Archive -Path "SnakeGame-win32-x64" -DestinationPath "Snake-Windows.zip"

      - name: Zip Output (macOS)
        if: matrix.os == 'macos-latest'
        run: zip -r "Snake-macOS.zip" "SnakeGame-darwin-x64"

      - name: Zip Output (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: zip -r "Snake-Linux.zip" "SnakeGame-linux-x64"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snake-${{ matrix.os }}
          path: Snake-*.zip
