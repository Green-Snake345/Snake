name: Nativefier Build for All Platforms

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Setup Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Nativefier
        run: npm install -g nativefier@47.3.0

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0 libnss3 libxss1 libasound2

      - name: Build App
        run: |
          nativefier --name "SnakeGame" \
                     --icon https://green-snake345.github.io/Snake/icon-192.png \
                     --single-instance \
                     https://green-snake345.github.io/Snake/
          
          echo "=== Созданные файлы ==="
          ls -la || dir

      - name: Zip Output (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $folder = Get-ChildItem -Directory -Filter "SnakeGame*" | Select-Object -First 1
          if ($folder) {
            Compress-Archive -Path $folder.FullName -DestinationPath "Snake-Windows.zip"
            echo "Упаковано: $($folder.Name)"
          } else {
            echo "Папка не найдена!"
            Get-ChildItem
            exit 1
          }

      - name: Zip Output (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          folder=$(ls -d SnakeGame* 2>/dev/null | head -1)
          if [ -n "$folder" ]; then
            zip -r "Snake-Linux.zip" "$folder"
            echo "Упаковано: $folder"
          else
            echo "Папка не найдена!"
            ls -la
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Snake-${{ matrix.os }}
          path: Snake-*.zip
