name: Nativefier Build - Windows and Linux

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container:
      image: node:18-bookworm
    
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y zip libgtk-3-0 libnss3 libxss1 libasound2 libatk-bridge2.0-0 libx11-xcb1 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libpango-1.0-0 libcairo2
      
      - name: Install Nativefier
        run: npm install -g nativefier
      
      - name: Check versions
        run: |
          node --version
          npm --version
          nativefier --version
      
      - name: Build Linux App
        run: |
          nativefier \
            --name "SnakeGame" \
            --icon "https://green-snake345.github.io/Snake/icon-192.png" \
            --single-instance \
            --verbose \
            https://green-snake345.github.io/Snake/
          
          ls -la
      
      - name: Package Linux
        run: |
          folder=$(ls -d SnakeGame* 2>/dev/null | head -1)
          if [ -n "$folder" ]; then
            zip -r "Snake-Linux.zip" "$folder"
            echo "Success: $folder"
          else
            echo "ERROR: No folder found"
            ls -la
            exit 1
          fi
      
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snake-Linux
          path: Snake-Linux.zip

  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Download and install Node.js 18
        shell: pwsh
        run: |
          Write-Host "Downloading Node.js 18..."
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v18.20.4/node-v18.20.4-x64.msi" -OutFile "$env:TEMP\node.msi"
          Write-Host "Installing Node.js 18..."
          Start-Process msiexec.exe -ArgumentList "/i", "$env:TEMP\node.msi", "/quiet", "/norestart" -Wait -NoNewWindow
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          Write-Host "Node version: $(node --version)"
          Write-Host "NPM version: $(npm --version)"
      
      - name: Install Nativefier
        shell: pwsh
        run: |
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          npm install -g nativefier
          Write-Host "Nativefier version: $(nativefier --version)"
      
      - name: Build Windows App
        shell: pwsh
        run: |
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          nativefier `
            --name "SnakeGame" `
            --icon "https://green-snake345.github.io/Snake/icon-192.png" `
            --single-instance `
            --verbose `
            https://green-snake345.github.io/Snake/
          
          Write-Host "=== Files ==="
          Get-ChildItem
      
      - name: Package Windows
        shell: pwsh
        run: |
          $folder = Get-ChildItem -Directory -Filter "SnakeGame*" | Select-Object -First 1
          if ($folder) {
            Compress-Archive -Path $folder.FullName -DestinationPath "Snake-Windows.zip" -Force
            Write-Host "Success: $($folder.Name)"
          } else {
            Write-Host "ERROR: No folder found"
            Get-ChildItem
            exit 1
          }
      
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snake-Windows
          path: Snake-Windows.zip
