name: Nativefier Build via Docker

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    container:
      image: node:20-bookworm
    
    steps:
      - name: Install system dependencies
        run: apt-get update && apt-get install -y zip wget libgtk-3-0 libnss3 libxss1 libasound2
      
      - name: Install Nativefier
        run: npm install -g nativefier@47.3.0
      
      - name: Build Windows App
        run: |
          echo "Node version: $(node --version)"
          nativefier --version
          
          nativefier \
            --name "SnakeGame" \
            --icon "https://green-snake345.github.io/Snake/icon-192.png" \
            --single-instance \
            --electron-version 28.3.3 \
            --platform win32 \
            --arch x64 \
            https://green-snake345.github.io/Snake/
          
          echo "=== Files ==="
          ls -la
      
      - name: Package
        run: |
          folder=$(ls -d SnakeGame* | head -1)
          zip -r "Snake-Windows.zip" "$folder"
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Snake-Windows
          path: Snake-Windows.zip

  build-linux:
    runs-on: ubuntu-latest
    container:
      image: node:20-bookworm
    
    steps:
      - name: Install system dependencies
        run: apt-get update && apt-get install -y zip wget libgtk-3-0 libnss3 libxss1 libasound2 libatk-bridge2.0-0 libx11-xcb1 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libpango-1.0-0 libcairo2
      
      - name: Install Nativefier
        run: npm install -g nativefier@47.3.0
      
      - name: Build Linux App
        run: |
          echo "Node version: $(node --version)"
          nativefier --version
          
          nativefier \
            --name "SnakeGame" \
            --icon "https://green-snake345.github.io/Snake/icon-192.png" \
            --single-instance \
            --electron-version 28.3.3 \
            --platform linux \
            --arch x64 \
            https://green-snake345.github.io/Snake/
          
          echo "=== Files ==="
          ls -la
      
      - name: Package
        run: |
          folder=$(ls -d SnakeGame* | head -1)
          zip -r "Snake-Linux.zip" "$folder"
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Snake-Linux
          path: Snake-Linux.zip
