name: Electron Builder - Windows and Linux

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Create Electron app structure
        shell: bash
        run: |
          mkdir -p electron-app
          cd electron-app
          
          cat > package.json << 'EOF'
          {
            "name": "snake-game",
            "version": "1.0.0",
            "description": "Snake Game",
            "main": "main.js",
            "scripts": {
              "start": "electron .",
              "build": "electron-builder"
            },
            "devDependencies": {
              "electron": "^28.0.0",
              "electron-builder": "^24.0.0"
            },
            "build": {
              "appId": "com.snake.game",
              "productName": "SnakeGame",
              "directories": {
                "output": "dist"
              },
              "files": [
                "main.js",
                "index.html"
              ],
              "linux": {
                "target": ["AppImage", "deb"],
                "category": "Game"
              },
              "win": {
                "target": ["nsis", "portable"]
              }
            }
          }
          EOF
          
          cat > main.js << 'EOF'
          const { app, BrowserWindow } = require('electron');
          
          function createWindow() {
            const win = new BrowserWindow({
              width: 1200,
              height: 800,
              webPreferences: {
                nodeIntegration: false
              }
            });
            
            win.loadURL('https://green-snake345.github.io/Snake/');
          }
          
          app.whenReady().then(createWindow);
          
          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });
          EOF
          
          echo "Electron app structure created"
      
      - name: Install dependencies
        working-directory: ./electron-app
        run: npm install
      
      - name: Build for Linux
        if: matrix.os == 'ubuntu-latest'
        working-directory: ./electron-app
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libnss3 libxss1 libasound2
          npm run build -- --linux
          ls -la dist/
      
      - name: Build for Windows
        if: matrix.os == 'windows-latest'
        working-directory: ./electron-app
        run: |
          npm run build -- --win
          Get-ChildItem dist/
      
      - name: Upload Linux artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Linux
          path: electron-app/dist/*.AppImage
      
      - name: Upload Windows artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Windows
          path: electron-app/dist/*.exe
