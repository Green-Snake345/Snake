name: Build Mobile Apps (Android + iOS)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'index.js'
      - 'manifest.json'
      - '*.css'
      - '*.png'

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
      
      - name: Init Capacitor
        run: npx cap init "Змейка" "com.greensnake.snake" --web-dir=.
      
      - name: Add Android platform
        run: npx cap add android
      
      - name: Sync
        run: npx cap sync android
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Build APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Snake-Android-APK
          path: android/app/build/outputs/apk/release/*.apk

  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/ios
      
      - name: Init Capacitor
        run: npx cap init "Змейка" "com.greensnake.snake" --web-dir=.
      
      - name: Add iOS platform
        run: npx cap add ios
      
      - name: Sync
        run: npx cap sync ios
      
      - name: Build iOS (unsigned)
        run: |
          cd ios
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath build/App.xcarchive archive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Snake-iOS-IPA
          path: ios/build/App.xcarchive
