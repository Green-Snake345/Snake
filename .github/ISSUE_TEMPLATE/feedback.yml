name: Обратная связь
description: Баг или идея для игры
title: ""
labels: []
body:
  - type: dropdown
    id: type
    attributes:
      label: Тип обращения
      options:
        - Баг
        - Предложение
        - Вопрос
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Описание
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
    validations:
      required: false
  - type: dropdown
    id: browser
    attributes:
      label: Браузер
      options:
        - Chrome
        - Яндекс Браузер
        - Firefox
        - Opera
        - DuckDuckGo
        - Microsoft Edge
    validations:
      required: false
  - type: dropdown
    id: device
    attributes:
      label: Устройство
      options:
        - Компьютер
        - Телефон
        - Планшет
        - Ноутбук
    validations:
      required: false
